# :schema https://mise.jdx.dev/schema/mise.json
# https://mise.jdx.dev/configuration.html
min_version = "2026.11.8"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

[settings.task]
run_auto_install = false
quiet = true

[task_config]
dir = "{{config_root}}"

[env]
UV_PROJECT = "{{config_root}}"

[tools]
betterleaks = "1.10.1"
dprint = "0.64.3"
jactionlint = "2.6.0"
lefthook = "2.2.2"
# Match the workstation Python 3.14 minor; CI also tests Python 3.12 and 3.15.
python = "3.14.10"
uv = "0.13.8"

[tasks.all]
description = "Format, check, audit, test, and build"
run = ["mise run format", "mise run check", "mise run audit", "mise run test", "mise run build"]

[tasks.install]
description = "Install the locked tools, dependencies, and local hooks"
run = [
  "mise install --locked",
  "UV_MALWARE_CHECK=1 uv sync --locked --preview-features malware-check",
  "lefthook install",
]

[tasks.format]
description = "Fix lint and format Python, Markdown, JSON, TOML, and YAML"
run = ["uv run --locked ruff check --fix .", "uv run --locked ruff format .", "dprint fmt"]

[tasks.check]
description = "Check lockfile, formatting, lint, types, metadata, and workflows"
run = [
  "uv lock --check",
  "uv run --locked ruff format --check .",
  "uv run --locked ruff check .",
  "uv run --locked ty check",
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked python scripts/verify_release.py",
  "dprint check",
  "jactionlint --profile pedantic",
  "betterleaks dir . --unsafe-auto-load-config --redact=100 --verbose --no-banner",
]

[tasks."check:leaks:full"]
description = "Scan the complete Git history for leaked secrets"
run = "betterleaks git --unsafe-auto-load-config --redact=100 --verbose --no-banner"

[tasks.test]
description = "Run tests with the coverage gate"
run = "uv run --locked pytest -q"

[tasks."check:hosts"]
description = "Report installed host versions and synthetic agent discovery (no model calls)"
run = "uv run --locked python scripts/check_hosts.py"

[tasks.audit]
description = "Audit locked Python dependencies for known vulnerabilities"
run = "uv audit --preview-features audit-command --locked"

[tasks.build]
description = "Build the documentation site and Python distributions"
depends = ["build:docs", "build:package"]

[tasks."build:docs"]
description = "Build the single-page README documentation site (Zensical)"
run = "uv run --locked zensical build --clean --strict"

[tasks."serve:docs"]
description = "Preview the documentation site (override port via PORT=8001)"
run = "uv run --locked zensical serve -a 127.0.0.1:${PORT:-8000}"

[tasks."build:package"]
description = "Build distributions and smoke-test the wheel in isolation"
run = [
  "uv build --out-dir dist --clear --no-sources",
  "uv run --isolated --no-project --with dist/supagents-*.whl supagents --version",
]

[tasks.clean]
description = "Remove build artifacts and coverage files"
run = "rm -rf .cache .coverage .coverage.* .pytest_cache .ruff_cache .ty_cache build dist htmlcov site"

[tasks.upgrade]
description = "Refresh locked Python dependencies within their constraints"
run = "UV_MALWARE_CHECK=1 uv lock --upgrade --preview-features malware-check"
