# Docs: https://zensical.org/docs/setup/basics/
[project]
site_name = "Supagents"
site_url = "https://fmind.github.io/agent-supagents/"
site_description = "Maintain shared subagent instructions and generate native coding-tool configurations."
site_author = "Médéric Hurier (Fmind)"
copyright = "Copyright &copy; 2026 Médéric Hurier (Fmind)"
repo_url = "https://github.com/fmind/agent-supagents"
repo_name = "fmind/agent-supagents"
exclude_docs = """
compatibility.md
usage.md
"""
nav = [
  { "Home" = "index.md" },
]
extra_css = ["stylesheets/fmind.css"]
watch = ["README.md"]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.action.copy",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Google Sans"
code = "Google Sans Code"

[project.theme.icon]
logo = "lucide/bot"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fmind/agent-supagents"
name = "Source repository"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tilde = {}

[project.plugins.llmstxt]
markdown_description = "Supagents compiles one Markdown role file into native subagent profiles across coding harnesses."
full_output = "llms-full.txt"
sections = { "Documentation" = ["index.md"] }

[project.plugins.social]

[project.plugins.minify]
minify_html = true

[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*"]
