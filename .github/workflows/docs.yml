# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# PRs validate docs strictly inside ci.yml (`mise run all`); this workflow deploys main to Pages.
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise tools
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
        with:
          tools: python uv
          cache: false
      - name: Build documentation site
        run: mise run build:docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    name: Deploy Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # Publish the built documentation site to GitHub Pages.
      id-token: write # Authenticate the Pages deployment via OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
