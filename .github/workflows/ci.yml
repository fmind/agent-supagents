# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run all
      - name: Reject generated drift
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
      - name: Check minimum Python
        if: runner.os == 'Linux'
        run: uv run --frozen --isolated --python 3.12 pytest -q
